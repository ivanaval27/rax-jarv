<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss://100.80.16.121:4433 wss://* ws://*; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
<title>RAX JARV 🎙️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #000000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
    gap: 20px;
  }
  h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #E30613, #FF6B00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .mic-btn {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid #333;
    background: #1a1a2e;
    font-size: 3rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .mic-btn.active {
    border-color: #00ff88;
    background: #002211;
    box-shadow: 0 0 40px #00ff8844;
    animation: pulse 1s infinite;
  }
  .mic-btn:active { transform: scale(0.95); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px #00ff8833; }
    50% { box-shadow: 0 0 60px #00ff8866; }
  }
  .status { color: #888; font-size: 1.1rem; min-height: 1.5rem; }
  .status.connected { color: #00ff88; }
  .status.recording { color: #ff4444; }
  .status.processing { color: #ffaa00; }
  .response-box {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 20px;
    max-width: 90vw;
    min-height: 60px;
    display: none;
    border-left: 3px solid #E30613;
    word-wrap: break-word;
  }
  .response-box.show { display: block; }
  .controls { display: flex; gap: 15px; align-items: center; }
  .btn-secondary {
    background: #1a1a2e;
    color: #aaa;
    border: 1px solid #333;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }
  .btn-secondary.active-mode {
    border-color: #E30613;
    color: #E30613;
  }
  
  /* ─── PIN Login ───────────────────────────────────── */
  .pin-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    z-index: 1000;
  }
  .pin-overlay.hidden { display: none; }
  .pin-title {
    font-size: 1.8rem;
    color: #fff;
  }
  .pin-subtitle {
    color: #888;
    font-size: 1rem;
  }
  .pin-dots {
    display: flex;
    gap: 15px;
    margin: 10px 0;
  }
  .pin-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #333;
    background: transparent;
    transition: all 0.3s;
  }
  .pin-dot.filled {
    background: #FF6B00;
    border-color: #FF6B00;
    box-shadow: 0 0 15px #FF6B0066;
  }
  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 12px;
    margin-top: 10px;
  }
  .pin-key {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a2e;
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .pin-key:active {
    background: #2a2a4e;
    transform: scale(0.92);
  }
  .pin-key.delete { font-size: 1.2rem; color: #ff4444; }
  .pin-key.empty { visibility: hidden; }
  .pin-error { color: #ff4444; font-size: 1rem; min-height: 1.5rem; }
  .main-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .main-content.hidden { display: none; }
  
  /* ─── Terminal de logs ──────────────────────────────── */
  .log-container {
    width: 100%;
    max-width: 500px;
    background: #0d0d1a;
    border: 1px solid #1a1a3e;
    border-radius: 10px;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #12122a;
    color: #888;
    cursor: pointer;
    user-select: none;
  }
  .log-header:hover { background: #1a1a3e; }
  .log-toggle { transition: transform 0.2s; }
  .log-toggle.collapsed { transform: rotate(-90deg); }
  .log-body {
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .log-body.collapsed { display: none; }
  .log-line { color: #0f0; word-break: break-all; line-height: 1.4; }
  .log-line.dim { color: #666; }
  .log-line.info { color: #FF6B00; }
  .log-line.warn { color: #fa0; }
  .log-line.done { color: #0f0; }
  .log-line.response { color: #fff; }
  .log-line.error { color: #f44; }
  .log-body::-webkit-scrollbar { width: 4px; }
  .log-body::-webkit-scrollbar-track { background: #0d0d1a; }
  .log-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  
  @media (max-width: 400px) {
    .pin-pad { gap: 8px; grid-template-columns: repeat(3, 70px); }
    .pin-key { width: 70px; height: 70px; font-size: 1.5rem; }
    .pin-title { font-size: 1.5rem; }
    .mic-btn { width: 100px; height: 100px; font-size: 2.5rem; }
    h1 { font-size: 2rem; }
  }
  @media (max-width: 350px) {
    .pin-pad { gap: 6px; grid-template-columns: repeat(3, 60px); }
    .pin-key { width: 60px; height: 60px; font-size: 1.3rem; }
    .pin-dots { gap: 10px; }
    .pin-dot { width: 16px; height: 16px; }
  }
</style>
</head>
<body onload="initApp()">

<!-- PIN Login -->
<div class="pin-overlay" id="pinOverlay" style="display:flex">
  <div class="pin-title">🔒 RAX</div>
  <div class="pin-subtitle">Ingresa el PIN de acceso</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-pad" id="pinPad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key delete" id="pinDelete">⌫</button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key empty"></button>
  </div>
</div>

<!-- Main Content -->
<div class="main-content hidden" id="mainContent">
  <h1>🎙️ RAX JARV</h1>
  <p style="color:#888">Presiona el botón para hablar</p>
  
  <div class="controls">
    <button class="btn-secondary active-mode" id="modePTT" onclick="setModePTT()">📞 PTT</button>
    <button class="btn-secondary" id="modeAuto" onclick="setModeAuto()">🎤 Auto</button>
    <button class="btn-secondary" id="logoutBtn" style="border-color:#ff4444;color:#ff4444" onclick="doLogout()">🔒 Salir</button>
  </div>
  
  <button class="mic-btn" id="micBtn" ontouchstart="startMic(event)" ontouchend="stopMic(event)" onmousedown="startMic(event)" onmouseup="stopMic(event)">🎤</button>
  <div class="status" id="status">Iniciando...</div>
  <div class="response-box" id="responseBox"></div>
  
  <!-- Terminal de logs -->
  <div class="log-container" id="logContainer">
    <div class="log-header" id="logHeader" onclick="toggleLog()">
      <span>🖥️ Terminal</span>
      <span class="log-toggle" id="logToggle">▼</span>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-line">[SISTEMA] Iniciando...</div>
    </div>
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────────────────
const WS_URL = 'wss://100.80.16.121:4433/ws';
const WS_FALLBACK = 'wss://192.168.2.24:4433/ws';
const PIN = '2727';

// ─── Globales ────────────────────────────────────────────────────────
let pinValue = '';
let ws = null;
let isConnected = false;
let isAutoMode = false;
let autoRecording = false;
let pcmActive = false;
let pcmChunks = [];
let pcmStream = null;
let pcmCtx = null;
let pcmSource = null;
let pcmProcessor = null;
let pcmSampleRate = 16000;
let logCollapsed = false;

function byId(id) { return document.getElementById(id); }

// ─── Init ────────────────────────────────────────────────────────────
function initApp() {
  addLog('Sistema iniciado', 'info');
  
  // PIN buttons via onclick on parent
  byId('pinPad').addEventListener('click', function(e) {
    var btn = e.target;
    if (btn.classList.contains('pin-key') && btn.dataset.key) {
      pinKey(btn.dataset.key);
    }
  });
  byId('pinPad').addEventListener('touchstart', function(e) {
    // prevent scroll while tapping PIN
  }, {passive: true});
  
  byId('pinDelete').addEventListener('click', function() { pinKey('delete'); });
  
  // Check saved auth (safe from file://)
  try {
    if (localStorage.getItem('rax_auth') === 'true') {
      showMain();
    }
  } catch(e) {
    addLog('localStorage no disponible', 'dim');
  }
  
  // Connect WebSocket
  connectWS();
}

// ─── UI Helpers ──────────────────────────────────────────────────────
function showMain() {
  byId('pinOverlay').style.display = 'none';
  byId('mainContent').classList.remove('hidden');
  byId('status').textContent = '✅ Conectando...';
  byId('status').className = 'status';
}

function setStatus(text, cls) {
  var el = byId('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

// ─── PIN ─────────────────────────────────────────────────────────────
function updateDots() {
  for (var i = 0; i < 4; i++) {
    var d = byId('dot' + i);
    d.className = 'pin-dot' + (i < pinValue.length ? ' filled' : '');
  }
}

function pinKey(key) {
  byId('pinError').textContent = '';
  if (key === 'delete') { pinValue = pinValue.slice(0, -1); updateDots(); return; }
  if (pinValue.length >= 4) return;
  pinValue += key;
  updateDots();
  if (pinValue.length === 4) checkPin();
}

function checkPin() {
  if (pinValue === PIN) {
    localStorage.setItem('rax_auth', 'true');
    showMain();
  } else {
    byId('pinError').textContent = '❌ PIN incorrecto';
    pinValue = '';
    updateDots();
  }
}

// ─── WebSocket ───────────────────────────────────────────────────────
var wsRetries = 0;
var wsMaxRetries = 100;  // nunca dejar de intentar

function connectWS() {
  // Alternar entre URL primaria y fallback si se han hecho muchos intentos
  var url = wsRetries < 5 ? WS_URL : WS_FALLBACK;
  if (wsRetries === 5) addLog('Cambiando a IP local como fallback...', 'warn');
  try {
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function() {
      isConnected = true;
      wsRetries = 0;
      setStatus('✅ Conectado', 'connected');
      addLog('WebSocket conectado', 'done');
      // Si estaba en modo auto, reanudar micrófono automáticamente
      if (isAutoMode) {
        setTimeout(function() { doStartPCM(); }, 500);
      }
    };
    ws.onerror = function(err) {
      addLog('WS Error: ' + (err.message || err.type || 'desconocido'), 'error');
    };
    ws.onclose = function() {
      isConnected = false;
      setStatus('❌ Desconectado, reconectando...', '');
      wsRetries++;
      // Backoff exponencial: 1s, 2s, 4s, 8s... máximo 15s
      var delay = Math.min(1000 * Math.pow(2, Math.min(wsRetries, 5)), 15000);
      addLog('Reconectando en ' + (delay/1000) + 's... (intento ' + wsRetries + ')', 'dim');
      setTimeout(connectWS, delay);
    };
    ws.onmessage = function(e) {
      if (e.data instanceof ArrayBuffer) {
        var blob = new Blob([e.data], {type: 'audio/mpeg'});
        var audio = new Audio(URL.createObjectURL(blob));
        audio.play().catch(function(){});
      } else {
        var msg = e.data;
        if (msg.startsWith('[LOG] ')) {
          var t = msg.replace('[LOG] ', '');
          var c = t.includes('❌') ? 'error' : t.includes('✅') ? 'done' : t.includes('💬') ? 'info' : 'dim';
          addLog(t, c);
        } else if (msg.startsWith('🤖 ')) {
          byId('responseBox').textContent = msg;
          byId('responseBox').className = 'response-box show';
          addLog(msg.replace('🤖 ', ''), 'response');
        } else if (msg.startsWith('📝 ')) {
          byId('responseBox').textContent = msg;
          byId('responseBox').className = 'response-box show';
        } else {
          byId('responseBox').textContent = msg;
          byId('responseBox').className = 'response-box show';
        }
      }
    };
  } catch(e) {
    addLog('WS Error: ' + e.message, 'error');
    wsRetries++;
    setTimeout(connectWS, 3000);
  }
}

// ─── Mic ─────────────────────────────────────────────────────────────
function startMic(event) {
  if (event) event.preventDefault();
  if (isAutoMode) return;
  if (pcmActive) return;
  doStartPCM();
}

function stopMic(event) {
  if (event) event.preventDefault();
  if (isAutoMode) return;
  if (pcmActive) doStopPCM();
}

function doStartPCM() {
  addLog('Solicitando micrófono...', 'info');
  try {
    navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}})
    .then(function(stream) {
      pcmActive = true;
      pcmChunks = [];
      pcmStream = stream;
      
      try { pcmCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {
        addLog('Error AudioContext: ' + e.message, 'error');
        return;
      }
      pcmSampleRate = pcmCtx.sampleRate;
      pcmSource = pcmCtx.createMediaStreamSource(stream);
      
      try {
        pcmProcessor = pcmCtx.createScriptProcessor(4096, 1, 1);
      } catch(e) {
        // Fallback para algunos WebViews
        pcmProcessor = pcmCtx.createScriptProcessor(2048, 1, 1);
      }
      
      pcmProcessor.onaudioprocess = function(e) {
        if (!pcmActive) return;
        var input = e.inputBuffer.getChannelData(0);
        var buf = new Int16Array(input.length);
        for (var i = 0; i < input.length; i++) {
          var s = Math.max(-1, Math.min(1, input[i]));
          buf[i] = s < 0 ? s * 32768 : s * 32767;
        }
        pcmChunks.push(buf);
      };
      
      pcmSource.connect(pcmProcessor);
      pcmProcessor.connect(pcmCtx.destination);
      
      byId('micBtn').className = 'mic-btn active';
      setStatus('🎤 Grabando...', 'recording');
      addLog('🎤 Grabando...', 'warn');
    })
    .catch(function(err) {
      setStatus('❌ Micrófono: ' + err.message, '');
      addLog('❌ Error mic: ' + err.message, 'error');
      addLog('💡 Ve a Ajustes > RAX JARVIS > Permisos > Activar micrófono', 'info');
    });
  } catch(e) {
    setStatus('❌ Error: ' + e.message, '');
    addLog('❌ ' + e.message, 'error');
  }
}

function doStopPCM() {
  pcmActive = false;
  
  try { if (pcmProcessor) pcmProcessor.disconnect(); } catch(e) {}
  try { if (pcmSource) pcmSource.disconnect(); } catch(e) {}
  try { if (pcmCtx) pcmCtx.close(); } catch(e) {}
  if (pcmStream) pcmStream.getTracks().forEach(function(t) { t.stop(); });
  
  pcmProcessor = null; pcmSource = null; pcmCtx = null; pcmStream = null;
  byId('micBtn').className = 'mic-btn';
  
  if (pcmChunks.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
    var total = 0;
    for (var i = 0; i < pcmChunks.length; i++) total += pcmChunks[i].length;
    
    var pcmBlob = new Int16Array(total);
    var offset = 0;
    for (var j = 0; j < pcmChunks.length; j++) {
      pcmBlob.set(pcmChunks[j], offset);
      offset += pcmChunks[j].length;
    }
    
    setStatus('🧠 Procesando...', 'processing');
    addLog('Enviando audio (' + (total/pcmSampleRate).toFixed(1) + 's)...', 'info');
    
    var header = new TextEncoder().encode('PCM');
    var srBytes = new Uint8Array(2);
    srBytes[0] = pcmSampleRate & 0xFF;
    srBytes[1] = (pcmSampleRate >> 8) & 0xFF;
    var dataView = new Uint8Array(pcmBlob.buffer);
    var combined = new Uint8Array(header.length + srBytes.length + dataView.length);
    combined.set(header, 0);
    combined.set(srBytes, header.length);
    combined.set(dataView, header.length + srBytes.length);
    
    ws.send(combined.buffer);
  }
  
  pcmChunks = [];
  if (!isAutoMode) { setStatus('✅ Listo', 'connected'); }
}

// ─── Modes ───────────────────────────────────────────────────────────
function setModePTT() {
  isAutoMode = false; autoRecording = false;
  byId('modePTT').className = 'btn-secondary active-mode';
  byId('modeAuto').className = 'btn-secondary';
  cleanupPCM();
  setStatus('✅ PTT — Presiona el botón para hablar', 'connected');
  addLog('Modo PTT', 'info');
}

function setModeAuto() {
  isAutoMode = true;
  byId('modeAuto').className = 'btn-secondary active-mode';
  byId('modePTT').className = 'btn-secondary';
  setStatus('🎤 Modo automático', '');
  addLog('Modo Auto activado', 'info');
  startAutoMode();
}

// ─── Auto Mode (simplificado) ────────────────────────────────────────
function startAutoMode() {
  if (autoRecording) return;
  autoRecording = true;
  
  navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}})
  .then(function(stream) {
    var actx = new (window.AudioContext || window.webkitAudioContext)();
    var source = actx.createMediaStreamSource(stream);
    var analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    
    // 🆕 UN SOLO STREAM para VAD + grabación (sin segundo getUserMedia)
    var isSpeaking = false, silenceStart = 0;
    var autoChunks = [], autoRecActive = false;
    var aSR = actx.sampleRate;
    var aProc;
    try { aProc = actx.createScriptProcessor(4096, 1, 1); } catch(e) { aProc = actx.createScriptProcessor(2048, 1, 1); }
    aProc.onaudioprocess = function(e) {
      if (!autoRecActive) return;
      var input = e.inputBuffer.getChannelData(0);
      var buf = new Int16Array(input.length);
      for (var j = 0; j < input.length; j++) { var s2 = Math.max(-1, Math.min(1, input[j])); buf[j] = s2 < 0 ? s2 * 32768 : s2 * 32767; }
      autoChunks.push(buf);
    };
    source.connect(aProc);
    aProc.connect(actx.destination);
    
    function checkVoice() {
      var data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      var sum = 0; for (var i = 0; i < data.length; i++) sum += data[i];
      var avg = sum / data.length;
      
      if (avg > 12 && !isSpeaking) {
        isSpeaking = true; autoChunks = []; autoRecActive = true; silenceStart = 0;
        setStatus('🎤 Grabando...', 'recording');
        byId('micBtn').className = 'mic-btn active';
      } else if (avg < 8 && isSpeaking) {
        if (silenceStart === 0) silenceStart = Date.now();
        else if (Date.now() - silenceStart > 1200) {
          isSpeaking = false; silenceStart = 0; autoRecActive = false;
          if (autoChunks.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
            var total = 0; for (var i = 0; i < autoChunks.length; i++) total += autoChunks[i].length;
            var pcmBlob = new Int16Array(total); var off = 0;
            for (var i = 0; i < autoChunks.length; i++) { pcmBlob.set(autoChunks[i], off); off += autoChunks[i].length; }
            setStatus('🧠 Procesando...', 'processing');
            var header = new TextEncoder().encode('PCM');
            var srBytes = new Uint8Array(2); srBytes[0] = aSR & 0xFF; srBytes[1] = (aSR >> 8) & 0xFF;
            var dv = new Uint8Array(pcmBlob.buffer);
            var combined = new Uint8Array(header.length + srBytes.length + dv.length);
            combined.set(header, 0); combined.set(srBytes, header.length); combined.set(dv, header.length + srBytes.length);
            ws.send(combined.buffer);
          }
          autoChunks = []; byId('micBtn').className = 'mic-btn';
        }
      } else if (avg > 8 && isSpeaking) { silenceStart = 0; }
      if (autoRecording) requestAnimationFrame(checkVoice);
    }
    checkVoice();
  }).catch(function(err) {
    setStatus('❌ Error: ' + err.message, '');
    autoRecording = false;
  });
}

function cleanupPCM() {
  pcmActive = false; autoRecording = false;
  try { if (pcmProcessor) pcmProcessor.disconnect(); } catch(e) {}
  try { if (pcmSource) pcmSource.disconnect(); } catch(e) {}
  try { if (pcmCtx) pcmCtx.close(); } catch(e) {}
  if (pcmStream) pcmStream.getTracks().forEach(function(t) { t.stop(); });
  pcmProcessor = null; pcmSource = null; pcmCtx = null; pcmStream = null;
  pcmChunks = [];
  try { if (byId('micBtn')) byId('micBtn').className = 'mic-btn'; } catch(e) {}
}

// ─── Logout ──────────────────────────────────────────────────────────
function doLogout() {
  addLog('Cerrando sesión...', 'info');
  localStorage.removeItem('rax_auth');
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  cleanupPCM();
  isAutoMode = false; autoRecording = false;
  location.reload();
}

// ─── Terminal Log ────────────────────────────────────────────────────
function toggleLog() {
  logCollapsed = !logCollapsed;
  byId('logBody').classList.toggle('collapsed', logCollapsed);
  byId('logToggle').classList.toggle('collapsed', logCollapsed);
}

function addLog(text, className) {
  var el = byId('logBody');
  if (!el) return;
  var line = document.createElement('div');
  line.className = 'log-line ' + (className || 'dim');
  var now = new Date();
  var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
  line.textContent = '[' + time + '] ' + text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
