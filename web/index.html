<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAX JARVIS 🎙️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
    gap: 20px;
  }
  h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .mic-btn {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid #333;
    background: #1a1a2e;
    font-size: 3rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .mic-btn.active {
    border-color: #00ff88;
    background: #002211;
    box-shadow: 0 0 40px #00ff8844;
    animation: pulse 1s infinite;
  }
  .mic-btn:active { transform: scale(0.95); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px #00ff8833; }
    50% { box-shadow: 0 0 60px #00ff8866; }
  }
  .status { color: #888; font-size: 1.1rem; min-height: 1.5rem; }
  .status.connected { color: #00ff88; }
  .status.recording { color: #ff4444; }
  .status.processing { color: #ffaa00; }
  .response-box {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 20px;
    max-width: 90vw;
    min-height: 60px;
    display: none;
    border-left: 3px solid #7b2ff7;
    word-wrap: break-word;
  }
  .response-box.show { display: block; }
  .controls { display: flex; gap: 15px; align-items: center; }
  .btn-secondary {
    background: #1a1a2e;
    color: #aaa;
    border: 1px solid #333;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }
  .btn-secondary.active-mode {
    border-color: #00d4ff;
    color: #00d4ff;
  }
  
  /* ─── PIN Login ───────────────────────────────────── */
  .pin-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    z-index: 1000;
  }
  .pin-overlay.hidden { display: none; }
  .pin-title {
    font-size: 1.8rem;
    color: #fff;
  }
  .pin-subtitle {
    color: #888;
    font-size: 1rem;
  }
  .pin-dots {
    display: flex;
    gap: 15px;
    margin: 10px 0;
  }
  .pin-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #333;
    background: transparent;
    transition: all 0.3s;
  }
  .pin-dot.filled {
    background: #00d4ff;
    border-color: #00d4ff;
    box-shadow: 0 0 15px #00d4ff66;
  }
  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 12px;
    margin-top: 10px;
  }
  .pin-key {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a2e;
    color: #fff;
    font-size: 1.8rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .pin-key:active {
    background: #2a2a4e;
    transform: scale(0.92);
  }
  .pin-key.delete {
    font-size: 1.2rem;
    color: #ff4444;
  }
  .pin-key.empty { visibility: hidden; }
  .pin-error {
    color: #ff4444;
    font-size: 1rem;
    min-height: 1.5rem;
  }
  .main-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .main-content.hidden { display: none; }
  
  /* ─── Terminal de logs ──────────────────────────────── */
  .log-container {
    width: 100%;
    max-width: 500px;
    background: #0d0d1a;
    border: 1px solid #1a1a3e;
    border-radius: 10px;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #12122a;
    color: #888;
    cursor: pointer;
    user-select: none;
  }
  .log-header:hover { background: #1a1a3e; }
  .log-toggle { transition: transform 0.2s; }
  .log-toggle.collapsed { transform: rotate(-90deg); }
  .log-body {
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .log-body.collapsed { display: none; }
  .log-line {
    color: #0f0;
    word-break: break-all;
    line-height: 1.4;
  }
  .log-line.dim { color: #666; }
  .log-line.info { color: #0af; }
  .log-line.warn { color: #fa0; }
  .log-line.done { color: #0f0; }
  .log-line.response { color: #fff; }
  .log-line.error { color: #f44; }
  
  /* Scrollbar del log */
  .log-body::-webkit-scrollbar { width: 4px; }
  .log-body::-webkit-scrollbar-track { background: #0d0d1a; }
  .log-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  
  /* Responsive: más compacto en celulares */
  @media (max-width: 400px) {
    .pin-pad { gap: 8px; grid-template-columns: repeat(3, 70px); }
    .pin-key { width: 70px; height: 70px; font-size: 1.5rem; }
    .pin-title { font-size: 1.5rem; }
    .mic-btn { width: 100px; height: 100px; font-size: 2.5rem; }
    h1 { font-size: 2rem; }
  }
  @media (max-width: 350px) {
    .pin-pad { gap: 6px; grid-template-columns: repeat(3, 60px); }
    .pin-key { width: 60px; height: 60px; font-size: 1.3rem; }
    .pin-dots { gap: 10px; }
    .pin-dot { width: 16px; height: 16px; }
  }
</style>
</head>
<body>

<!-- PIN Login -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-title">🔒 RAX</div>
  <div class="pin-subtitle">Ingresa el PIN de acceso</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-pad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key delete" id="pinDelete">⌫</button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key empty"></button>
  </div>
</div>

<!-- Main Content -->
<div class="main-content hidden" id="mainContent">
  <h1>🎙️ RAX</h1>
  <p style="color:#888">Presiona el botón para hablar</p>
  
  <div class="controls">
    <button class="btn-secondary active-mode" id="modePTT">📞 PTT</button>
    <button class="btn-secondary" id="modeAuto">🎤 Auto</button>
    <button class="btn-secondary" id="logoutBtn" style="border-color:#ff4444;color:#ff4444">🔒 Salir</button>
  </div>
  
  <button class="mic-btn" id="micBtn">🎤</button>
  <div class="status" id="status">Conectando...</div>
  <div class="response-box" id="responseBox"></div>
  
  <!-- Terminal de logs -->
  <div class="log-container" id="logContainer">
    <div class="log-header" id="logHeader">
      <span>🖥️ Terminal</span>
      <span class="log-toggle" id="logToggle">▼</span>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-line">[SISTEMA] Conectando...</div>
    </div>
  </div>
</div>

<script>
let pinValue = '';
const MAX_PIN = 4;
const PIN_ERROR = document.getElementById('pinError');

// ─── PIN Logic ────────────────────────────────────────────────────
function updatePinDots() {
  for (let i = 0; i < MAX_PIN; i++) {
    const dot = document.getElementById('dot' + i);
    dot.className = 'pin-dot' + (i < pinValue.length ? ' filled' : '');
  }
}

function pinKey(key) {
  PIN_ERROR.textContent = '';
  if (key === 'delete') {
    pinValue = pinValue.slice(0, -1);
    updatePinDots();
    return;
  }
  if (pinValue.length >= MAX_PIN) return;
  pinValue += key;
  updatePinDots();
  
  if (pinValue.length === MAX_PIN) {
    checkPin();
  }
}

async function checkPin() {
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pinValue })
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('rax_auth', 'true');
      document.getElementById('pinOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      setTimeout(() => statusEl.textContent = '✅ PTT — Presiona el botón para hablar', 500);
    } else {
      PIN_ERROR.textContent = '❌ PIN incorrecto';
      pinValue = '';
      updatePinDots();
    }
  } catch (e) {
    PIN_ERROR.textContent = '❌ Error de conexión';
    pinValue = '';
    updatePinDots();
  }
}

// Botones del PIN
document.querySelectorAll('.pin-key[data-key]').forEach(btn => {
  btn.addEventListener('click', () => pinKey(btn.dataset.key));
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); pinKey(btn.dataset.key); });
});
document.getElementById('pinDelete').addEventListener('click', () => pinKey('delete'));
document.getElementById('pinDelete').addEventListener('touchstart', (e) => { e.preventDefault(); pinKey('delete'); });

// ─── Verificar auth al cargar ─────────────────────────────────────
if (localStorage.getItem('rax_auth') === 'true') {
  document.getElementById('pinOverlay').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
}

// ─── WebSocket ─────────────────────────────────────────────────────
const WS_URL = `wss://${location.hostname}:4433/ws`;
let ws = null;
let isConnected = false;
let isAutoMode = false;
let autoRecording = false;

const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const responseBox = document.getElementById('responseBox');
const modePTT = document.getElementById('modePTT');
const modeAuto = document.getElementById('modeAuto');

function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    isConnected = true;
    statusEl.textContent = '✅ Conectado';
    statusEl.className = 'status connected';
  };
  ws.onclose = () => {
    isConnected = false;
    statusEl.textContent = '❌ Desconectado, reconectando...';
    statusEl.className = 'status';
    setTimeout(connectWS, 2000);
  };
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      const blob = new Blob([e.data], { type: 'audio/mpeg' });
      const audio = new Audio(URL.createObjectURL(blob));
      audio.play().catch(() => {});
    } else {
      const msg = e.data;
      if (msg.startsWith('[LOG] ')) {
        // Mensaje de log para la terminal
        const logText = msg.replace('[LOG] ', '');
        const logClass = logText.includes('❌') ? 'error' : 
                        logText.includes('✅') ? 'done' :
                        logText.includes('🤖') || logText.includes('💬') ? 'info' : 'dim';
        addLogLine(logText, logClass);
      } else if (msg.startsWith('🤖 ')) {
        // Respuesta de RAX
        responseBox.textContent = msg;
        responseBox.className = 'response-box show';
        addLogLine('🤖 ' + msg.replace('🤖 ', ''), 'response');
      } else if (msg.startsWith('📝 ')) {
        // Transcripción
        responseBox.textContent = msg;
        responseBox.className = 'response-box show';
      } else {
        responseBox.textContent = msg;
        responseBox.className = 'response-box show';
      }
    }
  };
}
connectWS();

// ─── PCM Recording ─────────────────────────────────────────────────
let pcmActive = false;
let pcmChunks = [];
let pcmStream = null;
let pcmCtx = null;
let pcmSource = null;
let pcmProcessor = null;
let pcmSampleRate = 16000;

async function startPCMCapture() {
  if (pcmActive) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    pcmCtx = new AudioContext();
    pcmSampleRate = pcmCtx.sampleRate;
    pcmChunks = [];
    pcmSource = pcmCtx.createMediaStreamSource(stream);
    const bufferSize = 4096;
    pcmProcessor = pcmCtx.createScriptProcessor(bufferSize, 1, 1);
    pcmProcessor.onaudioprocess = (e) => {
      if (!pcmActive) return;
      const input = e.inputBuffer.getChannelData(0);
      const int16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        int16[i] = s < 0 ? s * 32768 : s * 32767;
      }
      pcmChunks.push(int16);
    };
    pcmSource.connect(pcmProcessor);
    pcmProcessor.connect(pcmCtx.destination);
    pcmActive = true;
    pcmStream = stream;
    micBtn.className = 'mic-btn active';
    statusEl.textContent = '🎤 Grabando...';
    statusEl.className = 'status recording';
  } catch (e) {
    statusEl.textContent = '❌ Error: ' + e.message;
    statusEl.className = 'status';
    cleanupPCM();
  }
}

function stopPCMCapture() {
  if (!pcmActive) return;
  pcmActive = false;
  if (pcmProcessor) try { pcmProcessor.disconnect(); } catch(e) {}
  if (pcmSource) try { pcmSource.disconnect(); } catch(e) {}
  if (pcmCtx) try { pcmCtx.close(); } catch(e) {}
  if (pcmStream) pcmStream.getTracks().forEach(t => t.stop());
  pcmProcessor = null; pcmSource = null; pcmCtx = null; pcmStream = null;
  micBtn.className = 'mic-btn';
  
  if (pcmChunks.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
    const totalSamples = pcmChunks.reduce((acc, c) => acc + c.length, 0);
    const pcmBlob = new Int16Array(totalSamples);
    let offset = 0;
    for (const chunk of pcmChunks) { pcmBlob.set(chunk, offset); offset += chunk.length; }
    statusEl.textContent = '🧠 Procesando...';
    statusEl.className = 'status processing';
    const header = new TextEncoder().encode('PCM');
    const srBytes = new Uint8Array(2);
    srBytes[0] = pcmSampleRate & 0xFF;
    srBytes[1] = (pcmSampleRate >> 8) & 0xFF;
    const dataView = new Uint8Array(pcmBlob.buffer);
    const combined = new Uint8Array(header.length + srBytes.length + dataView.length);
    combined.set(header, 0);
    combined.set(srBytes, header.length);
    combined.set(dataView, header.length + srBytes.length);
    ws.send(combined.buffer);
  }
  pcmChunks = [];
  if (!isAutoMode) { statusEl.textContent = '✅ Listo'; statusEl.className = 'status connected'; }
}

function cleanupPCM() {
  pcmActive = false;
  try { if (pcmProcessor) pcmProcessor.disconnect(); } catch(e) {}
  try { if (pcmSource) pcmSource.disconnect(); } catch(e) {}
  try { if (pcmCtx) pcmCtx.close(); } catch(e) {}
  if (pcmStream) pcmStream.getTracks().forEach(t => t.stop());
  pcmProcessor = null; pcmSource = null; pcmCtx = null; pcmStream = null;
  pcmChunks = [];
}

// ─── PTT Mode ──────────────────────────────────────────────────────
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isAutoMode) startPCMCapture(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); if (!isAutoMode) stopPCMCapture(); });
micBtn.addEventListener('mousedown', () => { if (!isAutoMode) startPCMCapture(); });
micBtn.addEventListener('mouseup', () => { if (!isAutoMode) stopPCMCapture(); });

// ─── Auto Mode ─────────────────────────────────────────────────────
async function startAutoMode() {
  if (autoRecording) return;
  autoRecording = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const actx = new AudioContext();
    const source = actx.createMediaStreamSource(stream);
    const analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    let isSpeaking = false, silenceStart = 0, autoChunks = [];
    let autoStream2 = null, autoCtx2 = null, autoSource2 = null, autoProc2 = null, autoSR = 16000, autoRecActive = false;
    
    function autoCheckVoice() {
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      
      if (avg > 15 && !isSpeaking) {
        isSpeaking = true; autoChunks = []; autoRecActive = false; silenceStart = 0;
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(s => {
          autoStream2 = s; autoCtx2 = new AudioContext(); autoSR = autoCtx2.sampleRate;
          autoSource2 = autoCtx2.createMediaStreamSource(s);
          autoProc2 = autoCtx2.createScriptProcessor(4096, 1, 1);
          autoProc2.onaudioprocess = (e) => {
            if (!autoRecActive) return;
            const input = e.inputBuffer.getChannelData(0);
            const int16 = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
              const s2 = Math.max(-1, Math.min(1, input[i]));
              int16[i] = s2 < 0 ? s2 * 32768 : s2 * 32767;
            }
            autoChunks.push(int16);
          };
          autoSource2.connect(autoProc2); autoProc2.connect(autoCtx2.destination);
          autoRecActive = true;
        });
        statusEl.textContent = '🎤 Grabando...'; statusEl.className = 'status recording';
        micBtn.className = 'mic-btn active';
      } else if (avg < 8 && isSpeaking) {
        if (silenceStart === 0) silenceStart = Date.now();
        else if (Date.now() - silenceStart > 1200) {
          isSpeaking = false; silenceStart = 0; autoRecActive = false;
          if (autoProc2) try { autoProc2.disconnect(); } catch(e) {}
          if (autoSource2) try { autoSource2.disconnect(); } catch(e) {}
          if (autoCtx2) try { autoCtx2.close(); } catch(e) {}
          if (autoStream2) autoStream2.getTracks().forEach(t => t.stop());
          autoProc2 = null; autoSource2 = null; autoCtx2 = null; autoStream2 = null;
          if (autoChunks.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
            const totalSamples = autoChunks.reduce((acc, c) => acc + c.length, 0);
            const pcmBlob = new Int16Array(totalSamples);
            let offset = 0;
            for (const chunk of autoChunks) { pcmBlob.set(chunk, offset); offset += chunk.length; }
            statusEl.textContent = '🧠 Procesando...'; statusEl.className = 'status processing';
            const header = new TextEncoder().encode('PCM');
            const srBytes = new Uint8Array(2);
            srBytes[0] = autoSR & 0xFF; srBytes[1] = (autoSR >> 8) & 0xFF;
            const dataView = new Uint8Array(pcmBlob.buffer);
            const combined = new Uint8Array(header.length + srBytes.length + dataView.length);
            combined.set(header, 0); combined.set(srBytes, header.length); combined.set(dataView, header.length + srBytes.length);
            ws.send(combined.buffer);
          }
          autoChunks = []; micBtn.className = 'mic-btn';
        }
      } else if (avg > 8) { silenceStart = 0; }
      if (autoRecording) requestAnimationFrame(autoCheckVoice);
    }
    autoCheckVoice();
  } catch (e) {
    statusEl.textContent = '❌ Error: ' + e.message; statusEl.className = 'status';
    autoRecording = false;
  }
}

// ─── Mode Switch ────────────────────────────────────────────────────
modePTT.addEventListener('click', () => {
  isAutoMode = false; autoRecording = false;
  modePTT.className = 'btn-secondary active-mode'; modeAuto.className = 'btn-secondary';
  cleanupPCM();
  statusEl.textContent = '✅ PTT — Mantén presionado para hablar'; statusEl.className = 'status connected';
});
modeAuto.addEventListener('click', () => {
  isAutoMode = true;
  modeAuto.className = 'btn-secondary active-mode'; modePTT.className = 'btn-secondary';
  statusEl.textContent = '🎤 Modo automático'; statusEl.className = 'status';
  startAutoMode();
});

// ─── Logout ─────────────────────────────────────────────────────────
const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('rax_auth');
    if (ws) ws.close();
    cleanupPCM();
    isAutoMode = false;
    autoRecording = false;
    location.reload();
  });
}

// ─── Terminal de Logs ────────────────────────────────────────────────
const logBody = document.getElementById('logBody');
const logHeader = document.getElementById('logHeader');
const logToggle = document.getElementById('logToggle');
let logCollapsed = false;

function addLogLine(text, className = 'dim') {
  const line = document.createElement('div');
  line.className = 'log-line ' + className;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0') + ':' +
               now.getSeconds().toString().padStart(2,'0');
  line.textContent = `[${time}] ${text}`;
  logBody.appendChild(line);
  logBody.scrollTop = logBody.scrollHeight;
}

logHeader.addEventListener('click', () => {
  logCollapsed = !logCollapsed;
  logBody.classList.toggle('collapsed', logCollapsed);
  logToggle.classList.toggle('collapsed', logCollapsed);
});
</script>
</body>
</html>
